plugins {
    id "com.android.application"
}

def webAssetsDir = layout.buildDirectory.dir("generated/webAssets")

android {
    namespace "com.countaudit.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.countaudit.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDir(webAssetsDir)
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.15.0"
}

def syncWebAssets = tasks.register("syncWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "manifest.json"
        include "sw.js"
        include "assets/**"
        include "data/**"
    }
    into(webAssetsDir.map { it.dir("www") })
}

tasks.named("preBuild").configure {
    dependsOn(syncWebAssets)
}
